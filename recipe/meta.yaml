{% set name = "emc2" %}
{% set version = "1.3.7" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/emc2-{{ version }}.tar.gz
  sha256: ce3109a2b698ab1adc26204911f35a021a09eb2a325ba854b33cb9e10fb19328

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - xarray
    - matplotlib-base
    - dask
    - pint
    - act-atmos
    - openpyxl
    - numpy
    - nc-time-axis
    - cython
test:
  imports:
    - emc2
    - emc2.core
  commands:
    - pip install icartt
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/columncolab/EMC2
  summary: An open source framework for atmospheric model and observational column comparison.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rcjackson
    - mgrover1
    - isilber
